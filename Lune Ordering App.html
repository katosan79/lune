function Starfield() {
  const layer = (grad, size, anim) => (
    <div style={{position:'absolute', inset:'-40px', backgroundImage:grad, backgroundSize:size, animation:anim, pointerEvents:'none'}}></div>
  );
  return (
    <div style={{position:'absolute', inset:0, overflow:'hidden', pointerEvents:'none'}}>
      {layer('radial-gradient(1.1px 1.1px at 12% 20%, rgba(255,255,255,0.4), transparent), radial-gradient(1.1px 1.1px at 62% 44%, rgba(255,255,255,0.32), transparent), radial-gradient(1.1px 1.1px at 88% 74%, rgba(255,255,255,0.3), transparent)', '300px 300px', 'lune-star-far 16s linear infinite')}
      {layer('radial-gradient(1.5px 1.5px at 22% 34%, rgba(255,255,255,0.55), transparent), radial-gradient(1.3px 1.3px at 74% 18%, rgba(255,255,255,0.44), transparent), radial-gradient(1.5px 1.5px at 48% 78%, rgba(255,255,255,0.44), transparent)', '240px 240px', 'lune-star-mid 10s linear infinite')}
      {layer('radial-gradient(1.8px 1.8px at 30% 30%, rgba(255,255,255,0.62), transparent), radial-gradient(1.8px 1.8px at 82% 60%, rgba(255,255,255,0.5), transparent), radial-gradient(1.8px 1.8px at 58% 88%, rgba(255,255,255,0.46), transparent)', '160px 160px', 'lune-star-near 6s linear infinite')}
    </div>
  );
}

const ACC = 'oklch(0.47 0.075 55)';

class App extends React.Component {

    savedCard:null, useNewCard:false, saveCard:true,

    lastName:'', firstName:'', dobDay:'', dobMonth:'', dobYear:'', signupReturnTo:'store', lastEarned:0, memberSince:null,
    orderHistory:[], menuView:'grid', winW: window.innerWidth,

  componentWillUnmount(){ clearTimeout(this._toast); clearTimeout(this._k1); clearTimeout(this._k2); clearTimeout(this._otpT); clearTimeout(this._splashT); clearTimeout(this._launchT); document.removeEventListener('keydown', this._onKeyActivate); window.removeEventListener('resize', this._onResize); }

  componentDidMount(){
    this._onKeyActivate = (e)=>{
      if((e.key==='Enter' || e.key===' ') && e.target && e.target.classList && e.target.classList.contains('clickable')){
        e.preventDefault();

    this._a11yPass();
    try {

    } catch(e){ /* localStorage unavailable or corrupt entry — proceed without a saved card */ }
  }
  componentDidUpdate(){
    this._a11yPass();
    if (this.state.screen==='menu' && this._tabRowRef && this._tabRefs) {
      const activeEl = this._tabRefs[this.state.category];
      if (activeEl) {
        const rowRect = this._tabRowRef.getBoundingClientRect();
        const elRect = activeEl.getBoundingClientRect();
        const left = elRect.left - rowRect.left + this._tabRowRef.scrollLeft;
        const width = elRect.width;
        const cur = this.state.tabIndicator;
        if (!cur || Math.abs(cur.left-left)>0.5 || Math.abs(cur.width-width)>0.5) {
          this.setState({ tabIndicator: { left, width } });

  _a11yPass(){

    });
  }

  magnetic(e){
    const el = e.currentTarget;
    const r = el.getBoundingClientRect();
    const mx = (e.clientX - (r.left + r.width/2)) * 0.15;
    const my = (e.clientY - (r.top + r.height/2)) * 0.15;
    el.style.transform = 'translate(' + mx.toFixed(1) + 'px,' + my.toFixed(1) + 'px)';
  }

    this.setState({ screen:'login', user:'', guest:false, phone:'', otp:'', cart:[], name:'', applyRewards:false, qrOpen:false, navStack:[], firstName:'', lastName:'', dobDay:'', dobMonth:'', dobYear:'', rewards:0, memberSince:null, orderHistory:[], fav:{}, savedCard:null, useNewCard:false });
  }
  qrSrc(){
    if(this._qr) return this._qr;
    const N=25, cell=8, q=2, size=(N+2*q)*cell;
    let seed=20240815; const rnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; };
    const fin=(r,c,br,bc)=>{ const rr=r-br, cc=c-bc; if(rr<0||rr>6||cc<0||cc>6) return null; const edge=rr===0||rr===6||cc===0||cc===6; const inner=rr>=2&&rr<=4&&cc>=2&&cc<=4; return edge||inner; };
    let rects='';
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      let on = fin(r,c,0,0); if(on===null) on=fin(r,c,0,N-7); if(on===null) on=fin(r,c,N-7,0);
      if(on===null) on = rnd()>0.52;
      if(on) rects+='<rect x="'+((c+q)*cell)+'" y="'+((r+q)*cell)+'" width="'+cell+'" height="'+cell+'"/>';
    }
    const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'"><rect width="'+size+'" height="'+size+'" fill="#f2ede6"/><g fill="#141414">'+rects+'</g></svg>';
    this._qr='data:image/svg+xml,'+encodeURIComponent(svg);
    return this._qr;
  }
  onFeatureScroll(e){ const el=e.target; const i=Math.round(el.scrollLeft/(el.clientWidth*0.84+14)); if(i!==this.state.featureIdx) this.setState({ featureIdx:i }); }

  pressOtp(k){ let o=this.state.otp; if(k==='⌫') o=o.slice(0,-1); else if(o.length<4) o=o+k; this.setState({ otp:o }); if(o.length===4){ clearTimeout(this._otpT); this._otpT=setTimeout(()=>this.loginSuccess(), 480); } }

  loadProfile(){

    return null;
  }
  loadOrderHistory(){
    try{ const raw = localStorage.getItem('lune_order_history'); if(raw) return JSON.parse(raw); }catch(e){ /* localStorage unavailable or corrupt entry */ }
    return [];

  seedOrderHistory(){
    const dayMs = 86400000;
    const label = (daysAgo)=> new Date(Date.now()-daysAgo*dayMs).toLocaleDateString('en-AU',{weekday:'short', day:'numeric', month:'short'});
    const priceOf = (id)=>{ const it=this._findItem(id); return it?it.price:0; };
    const mk = (daysAgo, storeName, pickup, items)=>{
      const subtotal = items.reduce((a,r)=>{
        const milkUp = (r.milk && r.milk!=='Full cream') ? MILK_UP*(r.qty||1) : 0;
        return a + priceOf(r.id)*(r.qty||1) + milkUp;
      },0);
      return {
        orderNo:'LN-'+Math.floor(1000+Math.random()*9000), dateLabel:label(daysAgo), store:storeName, pickup, items,
        total:Math.round(subtotal*100)/100, earned:Math.round(subtotal*0.05*100)/100,
      };
    };
    return [
      mk(4, 'Fitzroy', 'ASAP ~15min', [{id:'almond',qty:1},{id:'latte',qty:1,milk:'Oat'}]),
      mk(11, 'Fitzroy', 'ASAP ~15min', [{id:'box6trad',qty:1}]),

  validateDob(){
    const d = parseInt(this.state.dobDay,10), m = parseInt(this.state.dobMonth,10), y = parseInt(this.state.dobYear,10);
    if(!d || !m || !y) return false;
    if(y<1920 || y>new Date().getFullYear()) return false;
    const dt = new Date(y, m-1, d);
    return dt.getFullYear()===y && dt.getMonth()===m-1 && dt.getDate()===d;
  }
  submitDob(){
    if(!this.validateDob()){ this.showToast('Enter a valid birthday'); return; }
    const dob = String(this.state.dobDay).padStart(2,'0')+'/'+String(this.state.dobMonth).padStart(2,'0')+'/'+this.state.dobYear;

  reorderAdd(row){ const item=this._findItem(row.id); if(item) this.addLine(item, row.qty||1, row.size||'Regular', row.temp||'Hot', row.milk||'Full cream'); }

  go(screen){ this.setState(s=>{ const p={ navStack:[...s.navStack, s.screen], screen }; if(screen==='menu') p.menuScrolled=false; if(screen==='store') p.greetIdx=Math.floor(Math.random()*GREETINGS.length); return p; }); }
  showToast(msg){ clearTimeout(this._toast); this.setState({ toast:msg }); this._toast=setTimeout(()=>this.setState({ toast:null }), 1700); }

  unitPrice(item, size, milk){
    let p = item.price;
    if(item.drink && item.milk && milk && milk!=='Full cream') p += MILK_UP;
    return p;
  }
  variantLabel(item, size, temp, milk){ return (item.drink && item.milk && milk && milk!=='Full cream') ? milk : ''; }
  openItem(item){ this.setState({ screen:'item', active:item, qty:1, size:'Regular', temp:'Hot', milk:'Full cream' }); }
  quickAdd(item){ if(item.drink && item.milk){ this.openItem(item); return; } this.addLine(item, 1, 'Regular', 'Hot', 'Full cream'); }

  addLine(item, qty, size, temp, milk, silent){
    const key = item.id + '|' + this.variantLabel(item,size,temp,milk);
    this.setState(prevState => {
      const cart = prevState.cart.slice();
      const ex = cart.find(l=>l.key===key);
      if(ex){ ex.qty += qty; } else {
        cart.push({ key, id:item.id, name:item.name, unit:this.unitPrice(item,size,milk), qty, variant:this.variantLabel(item,size,temp,milk) });
      }
      return { cart };

    if(!silent) this.showToast('Added ' + item.name);

  changeLine(key, d){

  forgetSavedCard(e){
    if(e && e.stopPropagation) e.stopPropagation();

    this.setState({ savedCard:null, useNewCard:true });
  }
  validateCard(){
    const errors = {};
    const digits = this.state.cardNumber.replace(/\s+/g,'');
    if(digits.length<13 || digits.length>16) errors.cardNumber = 'Enter a valid card number';
    const m = /^(\d{2})\/(\d{2})$/.exec(this.state.cardExpiry);
    if(!m) errors.cardExpiry = 'MM/YY';
    else {
      const mm = parseInt(m[1],10), yy = parseInt(m[2],10);
      const now = new Date(), curYY = now.getFullYear()%100, curMM = now.getMonth()+1;
      if(mm<1||mm>12) errors.cardExpiry = 'Invalid month';
      else if(yy<curYY || (yy===curYY && mm<curMM)) errors.cardExpiry = 'Card expired';
    }
    if(this.state.cardCvc.length<3) errors.cardCvc = 'CVC';
    if(!this.state.cardName.trim()) errors.cardName = 'Required';
    return errors;

  cardReady(){

      if(this.state.saveCard){

  }

  chip(active){

          <span style={{fontFamily:"'Space Grotesk',sans-serif", fontWeight:700, fontSize:17, letterSpacing:'-0.01em'}}>LUNE</span>
        </div>
        <div style={{display:'flex', alignItems:'center', gap:24}}>
          <span className="clickable link-muted" onClick={()=>this.go('store')} style={{fontFamily:"'JetBrains Mono',monospace", fontSize:12, color:'#c3b8ab', cursor:'pointer'}}>{store.name} · CHANGE</span>

            const profileRows = [
              { label:'FULL NAME', value:(s.user||'') + (s.lastName? ' '+s.lastName : '') || 'Guest' },
              { label:'MOBILE', value:'+61 '+(s.phone? (s.phone.slice(0,3)+' '+s.phone.slice(3,6)+' '+s.phone.slice(6,9)) : '412 345 678') },
              { label:'BIRTHDAY', value:(s.dobDay && s.dobMonth) ? (s.dobDay.padStart(2,'0')+'/'+s.dobMonth.padStart(2,'0')) : 'Not set' },
              { label:'SAVED STORE', value:store.name },
              { label:'DIETARY', value:'None set' },
            ];
            return (
            <div className="lune-scroll" style={{height:'100%', overflowY:'auto', background:'#0b0805', color:'#f2ede6', position:'relative', animation:'lune-enter .32s ease both'}}>
              <Starfield/>
              <div style={{position:'relative', padding:'52px 26px 34px'}}>
                <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                  <div className="clickable link-muted" onClick={()=>this.goBack()} style={{fontFamily:"'JetBrains Mono',monospace", fontSize:12, color:'#9a8f80', cursor:'pointer'}}>‹ BACK</div>
                  <div className="clickable link-muted" onClick={()=>this.logout()} style={{fontFamily:"'JetBrains Mono',monospace", fontSize:11, color:'#9a8f80', cursor:'pointer'}}>LOG OUT</div>
                </div>
                <div style={{display:'flex', alignItems:'center', gap:16, marginTop:26}}>
                  <div style={{width:64, height:64, borderRadius:'50%', flexShrink:0, background:'linear-gradient(145deg,#4a3624,#17120d)', border:'1px solid rgba(255,255,255,0.2)', display:'flex', alignItems:'center', justifyContent:'center', fontFamily:"'Space Grotesk',sans-serif", fontWeight:700, fontSize:26, boxShadow:'0 0 30px -6px rgba(170,130,90,0.4)'}}>{initial}</div>
                  <div>
                    <div style={{fontFamily:"'Space Grotesk',sans-serif", fontWeight:700, fontSize:24, letterSpacing:'-0.02em'}}>{s.user||'Guest'}</div>
                    <div style={{fontFamily:"'JetBrains Mono',monospace", fontSize:10, color:'#9a8f80', marginTop:5, letterSpacing:'0.06em'}}>LUNE MEMBER · JOINED {s.memberSince||'—'}</div>
                  </div>
                </div>

                <div className="clickable qr-row" onClick={()=>this.openQr()} style={{marginTop:26, display:'flex', alignItems:'center', gap:18, border:'1.5px solid rgba(224,201,168,0.35)', borderRadius:22, padding:'22px', background:'rgba(255,255,255,0.05)', cursor:'pointer'}}>
                  <span style={{width:64, height:64, borderRadius:18, flexShrink:0, background:'#f2ede6', color:'#141414', display:'flex', alignItems:'center', justifyContent:'center'}}><svg width="34" height="34" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.2"><rect x="1.2" y="1.2" width="5" height="5" rx="1"></rect><rect x="9.8" y="1.2" width="5" height="5" rx="1"></rect><rect x="1.2" y="9.8" width="5" height="5" rx="1"></rect><path d="M9.8 9.8h2.2v2.2M14.8 9.8v5M9.8 14.8h5"></path></svg></span>
                  <div style={{flex:1}}>
                    <div style={{fontFamily:"'Space Grotesk',sans-serif", fontWeight:700, fontSize:19, letterSpacing:'-0.01em'}}>Membership QR</div>
                    <div style={{fontFamily:"'JetBrains Mono',monospace", fontSize:11, color:'#c3b8ab', marginTop:5}}>Scan in-store to earn &amp; redeem</div>
                  </div>
                  <span style={{color:'#e0c9a8', fontSize:22}}>›</span>
                </div>

                <div style={{display:'flex', gap:10, marginTop:12}}>
                  <div className="clickable qr-row" onClick={()=>this.go('orderHistory')} style={{flex:1, display:'flex', flexDirection:'column', gap:8, border:'1px solid rgba(255,255,255,0.14)', borderRadius:14, padding:'13px 14px', background:'rgba(255,255,255,0.03)', cursor:'pointer'}}>
                    <span style={{width:30, height:30, borderRadius:9, flexShrink:0, background:'#f2ede6', color:'#141414', display:'flex', alignItems:'center', justifyContent:'center'}}><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.3"><circle cx="8" cy="8" r="6.3"></circle><path d="M8 4.6v3.6l2.4 1.4"></path></svg></span>
                    <div style={{fontFamily:"'Space Grotesk',sans-serif", fontWeight:600, fontSize:12.5}}>Order History</div>
                  </div>
                  <div className="clickable qr-row" onClick={()=>this.go('favourites')} style={{flex:1, display:'flex', flexDirection:'column', gap:8, border:'1px solid rgba(255,255,255,0.14)', borderRadius:14, padding:'13px 14px', background:'rgba(255,255,255,0.03)', cursor:'pointer'}}>
                    <span style={{width:30, height:30, borderRadius:9, flexShrink:0, background:'#f2ede6', color:'#141414', display:'flex', alignItems:'center', justifyContent:'center'}}><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.3"><path d="M8 13.6s-5.6-3.4-5.6-7.3C2.4 4 4.1 2.4 6 2.4c1 0 1.6.5 2 1.1.4-.6 1-1.1 2-1.1 1.9 0 3.6 1.6 3.6 3.9 0 3.9-5.6 7.3-5.6 7.3z"></path></svg></span>
                    <div style={{fontFamily:"'Space Grotesk',sans-serif", fontWeight:600, fontSize:12.5}}>Favourites</div>
                  </div>
                </div>

                <div style={{display:'flex', gap:12, marginTop:14}}>
                  <div style={{flex:1, border:'1px solid rgba(255,255,255,0.14)', borderRadius:16, padding:16, background:'rgba(255,255,255,0.04)'}}>
                    <div style={{fontFamily:"'JetBrains Mono',monospace", fontSize:9.5, letterSpacing:'0.12em', color:'#9a8f80'}}>WALLET</div>
                    <div style={{fontFamily:"'Space Grotesk',sans-serif", fontWeight:700, fontSize:26, letterSpacing:'-0.02em', marginTop:8}}>{walletStr}</div>
                    <div className="clickable link-muted" style={{fontFamily:"'JetBrains Mono',monospace", fontSize:9.5, color:'#e0c9a8', marginTop:8, cursor:'pointer'}}>TOP UP +</div>
                  </div>
                  <div className="clickable rewards-card" onClick={()=>this.go('rewards')} style={{flex:1, border:'1px solid rgba(255,255,255,0.14)', borderRadius:16, padding:16, background:'rgba(255,255,255,0.04)', cursor:'pointer'}}>
                    <div style={{fontFamily:"'JetBrains Mono',monospace", fontSize:9.5, letterSpacing:'0.12em', color:'#9a8f80'}}>REWARDS</div>
                    <div style={{fontFamily:"'Space Grotesk',sans-serif", fontWeight:700, fontSize:26, letterSpacing:'-0.02em', marginTop:8}}>{rewardsStr}</div>
                    <div style={{fontFamily:"'JetBrains Mono',monospace", fontSize:9.5, color:'#e0c9a8', marginTop:8}}>VIEW ›</div>
                  </div>
                </div>

                <div style={{fontFamily:"'JetBrains Mono',monospace", fontSize:10.5, letterSpacing:'0.14em', color:'#9a8f80', margin:'30px 0 6px'}}>ACCOUNT DETAILS</div>
                <div style={{display:'flex', flexDirection:'column'}}>
                  {profileRows.map(row=>(
                    <div key={row.label} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'15px 0', borderBottom:'1px solid rgba(255,255,255,0.1)', fontFamily:"'JetBrains Mono',monospace", fontSize:12}}>
                      <span style={{color:'#9a8f80'}}>{row.label}</span><span style={{color:'#f2ede6', textAlign:'right', maxWidth:190}}>{row.value}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
            );
          })()}

          {s.screen==='orderHistory' && (()=>{
            const itemSummary = (items)=> items.map(r=>{
              const it = this._findItem(r.id);
              const nm = it ? it.name : 'Item';
              const milkTxt = (r.milk && r.milk!=='Full cream') ? ' ('+r.milk+')' : '';
              return (r.qty||1)+'× '+nm+milkTxt;
            }).join(', ');
            return (
            <div className="lune-scroll" style={{height:'100%', overflowY:'auto', background:'#0b0805', color:'#f2ede6', position:'relative', animation:'lune-enter .32s ease both'}}>
              <Starfield/>
              <div style={{position:'relative', padding:'52px 26px 34px'}}>
                <div className="clickable link-muted" onClick={()=>this.goBack()} style={{fontFamily:"'JetBrains Mono',monospace", fontSize:12, color:'#9a8f80', cursor:'pointer'}}>‹ BACK</div>
                <div style={{fontFamily:"'Space Grotesk',sans-serif", fontWeight:700, fontSize:26, letterSpacing:'-0.02em', marginTop:20}}>Order History</div>
                {s.orderHistory.length===0 ? (
                  <p style={{fontSize:13, lineHeight:1.6, color:'#c3b8ab', marginTop:20, maxWidth:260}}>No orders yet — your past pickups will show up here once you place an order.</p>
                ) : (
                  <div style={{display:'flex', flexDirection:'column', gap:14, marginTop:24}}>
                    {s.orderHistory.map((order,i)=>(
                      <div key={order.orderNo+i} style={{border:'1px solid rgba(255,255,255,0.14)', borderRadius:16, padding:'16px 18px', background:'rgba(255,255,255,0.04)', animation:'lune-fade-up .5s cubic-bezier(.16,.7,.2,1) both', animationDelay:(Math.min(i,9)*45)+'ms'}}>
                        <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline'}}>
                          <span style={{fontFamily:"'Space Grotesk',sans-serif", fontWeight:600, fontSize:15}}>{order.store}</span>
                          <span style={{fontFamily:"'JetBrains Mono',monospace", fontSize:10, color:'#9a8f80'}}>{order.dateLabel}</span>
                        </div>
                        <div style={{fontFamily:"'JetBrains Mono',monospace", fontSize:9.5, color:'#8a8375', marginTop:4, letterSpacing:'0.04em'}}>{order.orderNo} · {order.pickup}</div>
                        <div style={{fontSize:12.5, lineHeight:1.5, color:'#d3c6b5', marginTop:12}}>{itemSummary(order.items)}</div>
                        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:16}}>
                          <div>
                            <div style={{fontFamily:"'JetBrains Mono',monospace", fontSize:15}}>{money(order.total)}</div>
                            {order.earned>0 && <div style={{fontFamily:"'JetBrains Mono',monospace", fontSize:9.5, color:'#e0c9a8', marginTop:2}}>+{money(order.earned)} earned</div>}
                          </div>
                          <div className="clickable btn-outline" onClick={()=>this.reorderOrder(order)} style={{border:'1px solid rgba(255,255,255,0.28)', color:'#f2f1ee', borderRadius:10, padding:'10px 16px', fontFamily:"'JetBrains Mono',monospace", fontSize:11, cursor:'pointer'}}>REORDER</div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
            );
          })()}

          {s.screen==='favourites' && (()=>{
            const favIds = Object.keys(s.fav).filter(id=>s.fav[id]);
            const favItems = favIds.map(id=>this._findItem(id)).filter(Boolean);
            return (
            <div className="lune-scroll" style={{height:'100%', overflowY:'auto', background:'#0b0805', color:'#f2ede6', position:'relative', animation:'lune-enter .32s ease both'}}>
              <Starfield/>
              <div style={{position:'relative', padding:'52px 26px 34px'}}>
                <div className="clickable link-muted" onClick={()=>this.goBack()} style={{fontFamily:"'JetBrains Mono',monospace", fontSize:12, color:'#9a8f80', cursor:'pointer'}}>‹ BACK</div>
                <div style={{fontFamily:"'Space Grotesk',sans-serif", fontWeight:700, fontSize:26, letterSpacing:'-0.02em', marginTop:20}}>Favourites</div>
                {favItems.length===0 ? (
                  <p style={{fontSize:13, lineHeight:1.6, color:'#c3b8ab', marginTop:20, maxWidth:260}}>No favourites yet — tap the heart on any item to save it here.</p>
                ) : (
                  <div style={{display:'flex', flexDirection:'column', gap:14, marginTop:24}}>
                    {favItems.map((it,i)=>(
                      <div key={it.id} style={{border:'1px solid rgba(255,255,255,0.14)', borderRadius:16, padding:'14px 16px', background:'rgba(255,255,255,0.04)', display:'flex', gap:14, alignItems:'center', animation:'lune-fade-up .5s cubic-bezier(.16,.7,.2,1) both', animationDelay:(Math.min(i,9)*45)+'ms'}}>
                        <div style={{width:54, height:54, flexShrink:0, borderRadius:12, overflow:'hidden', background:'#efece6'}}>{this.thumbEl(it)}</div>
                        <div style={{flex:1, minWidth:0}}>
                          <div style={{fontFamily:"'Space Grotesk',sans-serif", fontWeight:600, fontSize:15}}>{it.name}</div>
                          <div style={{fontFamily:"'JetBrains Mono',monospace", fontSize:9.5, color:'#9a8f80', marginTop:3}}>{it.meta}</div>
                          <div style={{fontFamily:"'JetBrains Mono',monospace", fontSize:12, color:'#e0c9a8', marginTop:6}}>{priceStr(it.price)}</div>
                        </div>
                        <div style={{display:'flex', flexDirection:'column', alignItems:'flex-end', gap:10}}>
                          <div className="clickable plus-btn-sm" onClick={()=>this.quickAdd(it)} style={{width:30, height:30, background:'#141414', color:'#f4f4f2', display:'flex', alignItems:'center', justifyContent:'center', fontSize:17, borderRadius:8, cursor:'pointer'}}>+</div>
                          <span className="clickable link-muted" onClick={()=>this.toggleFavId(it.id)} style={{fontFamily:"'JetBrains Mono',monospace", fontSize:9.5, color:'#9a8f80', cursor:'pointer'}}>REMOVE</span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
            );
          })()}

          {s.qrOpen &&
            <div style={{position:'absolute', inset:0, zIndex:70, display:'flex', flexDirection:'column', justifyContent:'flex-end'}}>
              <div className="clickable" onClick={()=>this.closeQr()} style={{position:'absolute', inset:0, background:'rgba(9,6,3,0.66)', backdropFilter:'blur(3px)', animation:'lune-fade .25s ease both'}}></div>
              <div style={{position:'relative', background:'#1c1610', borderRadius:'28px 28px 0 0', padding:'14px 26px 30px', color:'#f2ede6', boxShadow:'0 -20px 50px -20px rgba(0,0,0,0.7)', animation:'lune-sheet .34s cubic-bezier(.2,.7,.2,1) both'}}>
                <div style={{width:40, height:4, borderRadius:4, background:'rgba(255,255,255,0.22)', margin:'0 auto 22px'}}></div>
                <div style={{fontFamily:"'JetBrains Mono',monospace", fontSize:10.5, letterSpacing:'0.16em', color:'#9a8f80', textAlign:'center'}}>LUNE MEMBERSHIP</div>
                <div style={{background:'#f2ede6', borderRadius:18, padding:20, margin:'18px auto 0', width:220}}>
                  <img src={this.qrSrc()} alt="Membership QR" style={{width:'100%', display:'block', imageRendering:'pixelated'}}/>
                </div>
                <div style={{textAlign:'center', marginTop:18}}>
                  <div style={{fontFamily:"'Space Grotesk',sans-serif", fontWeight:700, fontSize:19, letterSpacing:'-0.02em'}}>{s.user||'Guest'}</div>
                  <div style={{fontFamily:"'JetBrains Mono',monospace", fontSize:11, color:'#9a8f80', marginTop:6, letterSpacing:'0.14em'}}>MBR · 4471 0928</div>
                </div>
                <div style={{display:'flex', justifyContent:'center', gap:20, marginTop:20, fontFamily:"'JetBrains Mono',monospace", fontSize:11}}>
                  <span style={{color:'#9a8f80'}}>WALLET <span style={{color:'#e0c9a8'}}>{walletStr}</span></span>
                  <span style={{color:'#9a8f80'}}>REWARDS <span style={{color:'#e0c9a8'}}>{rewardsStr}</span></span>
                </div>
                <div className="clickable btn-outline" onClick={()=>this.closeQr()} style={{textAlign:'center', marginTop:22, border:'1px solid rgba(255,255,255,0.24)', borderRadius:14, padding:14, fontFamily:"'JetBrains Mono',monospace", fontSize:12, cursor:'pointer'}}>DONE</div>
              </div>
            </div>
          }

          {s.toast &&
            <div style={{position:'absolute', left:24, right:24, bottom:104, zIndex:60, background:ACC, color:'#f4f4f2', borderRadius:12, padding:'13px 16px', fontFamily:"'JetBrains Mono',monospace", fontSize:12, display:'flex', justifyContent:'space-between', alignItems:'center', boxShadow:'0 12px 30px -10px rgba(70,50,30,0.6)', animation:'lune-toast 1.7s ease both'}}>
              <span>{s.toast}</span><span style={{fontSize:14}}>✓</span>
            </div>
          }

        </div>
        </div>
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
  (function(){
    var src = document.getElementById('app-source').textContent;
    var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
    var s = document.createElement('script');
    s.textContent = out;
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
